services:
  verified:
    build: .
    image: verified-face-chain
    environment:
      HOST: 0.0.0.0            # inside the container only; the port is published to localhost
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # the whole project is mounted so the app can read .env and persist
      # CONTRACT_ADDRESS / COMMITMENT_SALT and the runs/ evidence folders.
      - .:/app
      # keep the baked-in models from the image instead of the (gitignored) host folder
      - /app/models
